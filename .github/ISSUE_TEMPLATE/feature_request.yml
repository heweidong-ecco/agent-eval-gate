name: 功能请求
description: 新增能力 / 改进现有行为
title: "[Feature] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标 / 用户价值
      description: 解决谁的什么问题?不要只写“想要 X”。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 可检查的条目(命令、输出、阈值)。
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 代价
      description: 你考虑过哪些做法?为什么选这个?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影响面
      options:
        - 判据 / 判分器
        - 评测集 / 阈值
        - 适配器 / 接入新被测
        - CLI / 报告
        - 语料 / 可复现性
        - CI / 工具链
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前自查
      options:
        - label: 我已确认 `docs/FAQ.md` / `docs/README.md` 里没有现成答案
          required: true
        - label: 我理解涉及口径/选型的改动需要一份 DEC
          required: false
