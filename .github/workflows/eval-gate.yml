# eval-gate CI 示例:评测门独立成 job(不并入纯代码门绿灯)。
# 纪律:改 Prompt/工具/记忆/评测集 → 必跑评测回归;低于阈值阻断(eval/阈值.md)。
# 另含「失败即补 case」硬门(依据 B 05-模块-评估与测试:84 + eval/cases/README.md)。
name: eval-gate

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要历史,供下面的「改动留痕」检查做 diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装(dev 含 pytest)
        run: pip install -e '.[dev]'

      - name: 单元 + 契约测试(离线、零外网)
        # 含 tests/test_failure_cases.py(eval/cases/ 每条必须带 regression.root_cause)
        # 与 tests/test_hooks.py(**门禁防腐**:语法/可执行/已注册/该拦的拦)
        run: pytest -q --junitxml=/tmp/junit.xml

      - name: 测试报告合规检查(防"假测试":空跑 / skip 冒充通过)
        # 口径:total>0 ∧ 失败=0 ∧ 错误=0 ∧ 跳过 ≤ 基线(默认 2 = live_smoke 的 2 条)
        run: python tools/check_pytest_report.py /tmp/junit.xml

      - name: 自证:忠实被测应过门(exit 0)
        run: python -m eval_gate run --evals eval/mini_rag_qa.evals.json --mode good --offline

      - name: 劣化回归:应被门拦(显式断言 exit 1)
        # 注意:此步**期望非零退出**(门拦下劣化),故必须自己断言,不能靠"非零即失败"。
        run: |
          set +e
          python -m eval_gate run --evals eval/mini_rag_qa.evals.json --mode bad --offline
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::期望 exit 1(劣化被门拦下),实际 $code"
            exit 1
          fi
          echo "✅ 劣化被拦(exit 1)"

      - name: 改动评测集/阈值须同步留痕(失败即补 case 硬门)
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || true)
          echo "$CHANGED" | sed 's/^/  changed: /'
          if echo "$CHANGED" | grep -qE '^eval/(fastapi_rag_golden\.evals\.json|mini_rag_qa\.evals\.json|阈值\.(md|json))'; then
            if ! echo "$CHANGED" | grep -qE '^(eval/cases/|docs/复盘/)'; then
              echo "::error::改动了评测集/阈值,但未在 eval/cases/ 或 docs/复盘/ 留痕。"
              echo "::error::依据「失败即补 case」:被测的失败 → eval/cases/(带 regression.root_cause);我方过程错误 → docs/复盘/。"
              exit 1
            fi
            echo "✅ 评测集/阈值改动已同步留痕"
          else
            echo "✅ 本次未改动评测集/阈值,跳过"
          fi

      - name: skill 覆盖检查(装了 skill 必须登记到路由/锚点表;母体 KD-9)
        run: ./tools/check-skill-coverage.sh .claude/skills -- CLAUDE.md

      - name: TDD 痕迹检查(改实现代码但未改测试 → 失败;可用 [no-test] 显式豁免)
        # 依据:母体 KD-9。**硬门**:失败而非 warning —— 提示会被忽略,只有红灯不会。
        # 豁免是**显式**的(提交信息含 [no-test]),必须付出"写一句理由"的成本,不能无声跳过。
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || true)

          # 显式豁免:区间内任一提交信息含 [no-test](纯重构/配置改动)
          if git log --format=%B "$BASE"..HEAD 2>/dev/null | grep -q '\[no-test\]'; then
            echo "✅ TDD 痕迹检查:已用 [no-test] 显式豁免"
            exit 0
          fi

          SRC=$(echo "$CHANGED" | grep -cE '^(app|backend|src)/.*\.(py|ts|js)$' || true)
          TST=$(echo "$CHANGED" | grep -cE '(^|/)tests?/.*\.(py|ts|js)$' || true)
          if [ "$SRC" -gt 0 ] && [ "$TST" -eq 0 ]; then
            echo "::error::改了 $SRC 个实现文件,但未改任何测试 —— TDD 痕迹缺失(母体 KD-9)。"
            echo "::error::请走 test-driven-development(先写测试);若确为纯重构/配置改动,"
            echo "::error::请在提交信息里加 [no-test] 并说明理由(显式豁免,不允许无声跳过)。"
            exit 1
          fi
          echo "✅ TDD 痕迹检查通过(实现 $SRC / 测试 $TST)"

      # 真实被测/真 judge 冒烟:配置密钥后放开(EVAL_LIVE=1)
      # - name: 真实冒烟(需密钥)
      #   run: EVAL_LIVE=1 pytest -q tests/test_live_smoke.py
