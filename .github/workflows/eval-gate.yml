# eval-gate CI 示例:评测门独立成 job(不并入纯代码门绿灯)。
# 纪律:改 Prompt/工具/记忆/评测集 → 必跑评测回归;低于阈值阻断(eval/阈值.md)。
# 另含「失败即补 case」硬门(依据 B 05-模块-评估与测试:84 + eval/cases/README.md)。
name: eval-gate

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要历史,供下面的「改动留痕」检查做 diff

      - name: 激活本地门禁钩子(与开发者 setup 走**同一脚本**)
        # `core.hooksPath` 是**本机 git 配置,克隆不携带** ⇒ 不跑这一步,新克隆/CI 上
        # 本地硬门静默失效。本步同时让 tests/test_hooks.py 那条「hooksPath 必须指向
        # .githooks」的断言变成"验证安装脚本有效",而不是"验证某台机器碰巧配过"。
        run: ./tools/setup-hooks.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装(dev 含 pytest)
        run: pip install -e '.[dev]'

      - name: 单元 + 契约测试(离线、零外网)+ 覆盖率门
        # 含 tests/test_failure_cases.py(eval/cases/ 每条必须带 regression.root_cause)
        # 与 tests/test_hooks.py(**门禁防腐**:语法/可执行/已注册/该拦的拦)
        # 覆盖率下限 85%(实测基线 89%;B 05-模块-评估与测试:60 目标 ≥80%);
        # 配置见 pyproject [tool.coverage.*],由 tests/test_coverage_gate.py 守。
        # ⚠️ 必须用块标量(|):YAML 的 plain scalar 会把换行**折成空格**,而**反斜杠是字面量** ——
        # 于是 `\ ` 把空格转义,`--junitxml=… --cov=eval_gate` 被当成**一个参数**,
        # pytest 立刻报用法错误 ⇒ 该步 **0 秒失败**(2026-09-12 实测踩到,还掩盖了另一个真失败)。
        run: |
          pytest -q --junitxml=/tmp/junit.xml \
            --cov=eval_gate --cov-report=term-missing --cov-fail-under=85

      - name: 测试报告合规检查(防"假测试":空跑 / skip 冒充通过)
        # 口径:total>0 ∧ 失败=0 ∧ 错误=0 ∧ 跳过 ≤ 基线(默认 2 = live_smoke 的 2 条)
        run: python tools/check_pytest_report.py /tmp/junit.xml

      - name: 自证:忠实被测应过门(exit 0)
        run: python -m eval_gate run --evals eval/mini_rag_qa.evals.json --mode good --offline

      - name: 劣化回归:应被门拦(显式断言 exit 1)
        # 注意:此步**期望非零退出**(门拦下劣化),故必须自己断言,不能靠"非零即失败"。
        run: |
          set +e
          python -m eval_gate run --evals eval/mini_rag_qa.evals.json --mode bad --offline
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::期望 exit 1(劣化被门拦下),实际 $code"
            exit 1
          fi
          echo "✅ 劣化被拦(exit 1)"

      - name: 改动评测集/阈值须同步留痕(失败即补 case 硬门)
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || true)
          echo "$CHANGED" | sed 's/^/  changed: /'
          if echo "$CHANGED" | grep -qE '^eval/(fastapi_rag_golden\.evals\.json|mini_rag_qa\.evals\.json|阈值\.(md|json))'; then
            # 留痕有三条合法路径(2026-09-12 补第三条,见 DEC-005):
            #   ① 被测的失败    → eval/cases/(带 regression.root_cause)
            #   ② 我方过程错误  → docs/复盘/
            #   ③ **决策驱动**的改动(扩充/转档/调阈值)→ docs/decisions/
            # ③ 是补上的缺口:此前只认"失败驱动",于是决策驱动的评测集改动**无合法留痕路径**。
            if ! echo "$CHANGED" | grep -qE '^(eval/cases/|docs/复盘/|docs/decisions/)'; then
              echo "::error::改动了评测集/阈值,但未在 eval/cases/、docs/复盘/ 或 docs/decisions/ 留痕。"
              echo "::error::被测的失败 → eval/cases/;我方过程错误 → docs/复盘/;决策驱动的改动 → docs/decisions/(须签核)。"
              exit 1
            fi
            echo "✅ 评测集/阈值改动已同步留痕"
          else
            echo "✅ 本次未改动评测集/阈值,跳过"
          fi

      - name: skill 覆盖检查(装了 skill 必须登记到路由/锚点表;母体 KD-9)
        run: ./tools/check-skill-coverage.sh .claude/skills -- CLAUDE.md

      - name: "TDD 痕迹检查(逐提交重算;[no-test: 理由] 显式豁免)"
        # 依据:母体 KD-9 / KD-10。**硬门**:失败而非 warning —— 提示会被忽略,只有红灯不会。
        #
        # ⚠️ 2026-09-11 升级:原先用「区间聚合 diff + 区间内任一提交含 [no-test] 即豁免全区间」,
        #   有两个**假阴性**:
        #     ① 区间内某提交改了实现却无测试,会被**另一个提交的测试改动掩盖**;
        #     ② 区间内任一提交写了 [no-test],就豁免**整个区间**。
        #   现改为**逐提交重算**(tools/check_gate_bypass.py),判据与本地门 1 完全一致。
        #   这也是 `git commit --no-verify` 在结构上**唯一绕不过**的一层:
        #   本地 hook 可被绕过,而"历史重放"绕不过。
        #   豁免必须带理由([no-test: <理由>]),裸标记不算 —— 让豁免可审计。
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          python tools/check_gate_bypass.py "$BASE"

      # 真实被测/真 judge 冒烟:配置密钥后放开(EVAL_LIVE=1)
      # - name: 真实冒烟(需密钥)
      #   run: EVAL_LIVE=1 pytest -q tests/test_live_smoke.py
