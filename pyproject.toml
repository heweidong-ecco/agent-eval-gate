[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-gate"
version = "0.3.0"
description = "Agent 生产就绪评测门:评测集 + 确定性规则 + LLM-as-Judge + 阈值门(自用先行)"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
eval-gate = "eval_gate.cli:main"

[tool.setuptools]
package-dir = {"" = "app"}
packages = ["eval_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# 只量被测包;__main__ 是 `python -m` 入口 shim,不含逻辑
source = ["eval_gate"]
omit = ["*/__main__.py"]

[tool.coverage.report]
# 下限 = 85(实测基线 89%,留 4pp 抖动余量;B 目标 ≥80%)
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    # 脚本入口 shim:测试走 `python -m eval_gate`,进的是 __main__.py,到不了这里
    "if __name__ == .__main__.:",
]
